services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nepal
      POSTGRES_PASSWORD: nepal
      POSTGRES_DB: nepalconnect
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepal"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://nepal:nepal@db:5432/nepalconnect?schema=public
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
