name: Mobile Android (AAB)

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Upload to Google Play internal track (needs PLAY_STORE_JSON_KEY secret)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_URL: ${{ secrets.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - name: Generate platform scaffolding (does not overwrite existing files)
        run: flutter create --platforms=android,ios --org com.nirajmallik --project-name nepalconnect .
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed AAB
        run: flutter build appbundle --release --dart-define=API_URL=${API_URL:-https://api.example.com}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play (internal track)
        if: ${{ github.event.inputs.upload_to_play == 'true' }}
        working-directory: mobile/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_STORE_JSON_KEY_PATH: ${{ github.workspace }}/mobile/android/google-play-key.json
        run: |
          echo "$PLAY_STORE_JSON_KEY" > google-play-key.json
          gem install bundler && bundle install
          bundle exec fastlane internal
          rm -f google-play-key.json
      - name: Clean up signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
